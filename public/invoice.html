<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الفاتورة والطباعة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .invoice-box {
            max-width: 850px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            position: relative;
        }
        .header-table {
            width: 100%;
            margin-bottom: 30px;
            border-bottom: 3px double #333;
            padding-bottom: 15px;
        }
        .title {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
        }
        .info-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }
        .info-item span {
            font-weight: bold;
            color: #555;
        }
        table.details-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            margin-bottom: 30px;
        }
        table.details-table th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            font-size: 15px;
        }
        table.details-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .total-section {
            text-align: left;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding-left: 15px;
            color: #c0392b;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn-print {
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print:hover { background-color: #2980b9; }

        @media print {
            body { padding: 0; }
            .invoice-box { border: none; box-shadow: none; }
            .btn-container { display: none; }
        }
    </style>
</head>
<body>

<div class="invoice-box" id="invoiceContent">
    <table class="header-table">
        <tr>
            <td class="title">فاتورة عبور شاحنات والسيارات</td>
            <td style="text-align: left; font-size: 14px; color: #777;">نظام المخلص الجمركي السحابي</td>
        </tr>
    </table>

    <div class="info-section">
        <div class="info-item"><span>رقم الفاتورة الآلي:</span> <mark id="lblInvoiceNo">جاري التحميل...</mark></div>
        <div class="info-item"><span>التاريخ:</span> <span id="lblDate">--</span></div>
        <div class="info-item"><span>الميناء / المنفذ:</span> <span id="lblPort">--</span></div>
        <div class="info-item"><span>رقم الإشعار أو البيان:</span> <span id="lblDeclaration">--</span></div>
    </div>

    <table class="details-table">
        <thead>
            <tr>
                <th>م</th>
                <th>اسم السائق</th>
                <th>رقم اللوحة</th>
                <th>نوع الرخصة</th>
                <th>العدد</th>
                <th>المبلغ (SAR)</th>
            </tr>
        </thead>
        <tbody id="itemsTableBody">
            </tbody>
    </table>

    <div class="total-section">
        إجمالي المبلغ المستحق: <span id="lblTotal">0.00</span> ريال سعودي
    </div>
</div>

<div class="btn-container">
    <button class="btn-print" onclick="window.print()">طباعة الفاتورة أو حفظها كـ PDF 🖨️</button>
</div>

<script>
    async function loadInvoiceDetails() {
        // قراءة الـ ID المبعوث في رابط المتصفح
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');

        if (!invoiceId) {
            alert('خطأ: لم يتم العثور على معرّف الفاتورة!');
            return;
        }

        try {
            // الاستعلام من السيرفر باستخدام المسار النسبي لمنع مشاكل النطاقات وتغير الروابط
            const response = await fetch(`/api/invoices/${invoiceId}`);
            if (!response.ok) throw new Error('فشل جلب تفاصيل الفاتورة من قاعدة البيانات.');

            const data = await response.json();

            // توزيع القيم داخل واجهة الـ HTML
            document.getElementById('lblInvoiceNo').innerText = String(data.invoice_no).padStart(5, '0');
            document.getElementById('lblDate').innerText = data.date;
            document.getElementById('lblPort').innerText = data.port;
            document.getElementById('lblDeclaration').innerText = data.declaration;

            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = '';
            let totalAmount = 0;

            // بناء أسطر الجدول ديناميكياً بناءً على بيانات Supabase
            data.carsData.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.driver_name || 'غير مسجل'}</td>
                    <td>${item.plate}</td>
                    <td>${item.license_type}</td>
                    <td>${item.cars_count}</td>
                    <td>${parseFloat(item.amount).toFixed(2)}</td>
                `;
                tbody.appendChild(row);
                totalAmount += (parseFloat(item.amount) * parseInt(item.cars_count));
            });

            document.getElementById('lblTotal').innerText = totalAmount.toFixed(2);

        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ أثناء عرض الفاتورة: ' + error.message);
        }
    }

    // تشغيل الدالة تلقائياً عند تحميل الصفحة
    window.onload = loadInvoiceDetails;
</script>
</body>
</html>
