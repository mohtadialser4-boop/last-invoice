<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء فاتورة جديدة - نظام إدارة الفواتير</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .card-row {
            border: 1px dashed #3498db;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            background: #fafbfc;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 10px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            margin-top: 25px;
        }
        .btn-submit:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام إدارة الفواتير والعبور</h2>
    <form id="invoiceForm">
        <div class="form-group">
            <label>الميناء:</label>
            <input type="text" id="port" required placeholder="مثال: ميناء جدة الإسلامي">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>رقم الإشعار / البيان:</label>
                <input type="text" id="declaration" required placeholder="أدخل الرقم">
            </div>
            <div class="form-group">
                <label>التاريخ:</label>
                <input type="date" id="date" required>
            </div>
        </div>

        <h3>بيانات السيارات والشاحنات</h3>
        <div id="carsContainer">
            <div class="card-row">
                <div class="grid-3">
                    <div>
                        <label>عدد السيارات:</label>
                        <input type="number" class="cars-count" value="1" min="1" required>
                    </div>
                    <div>
                        <label>رقم اللوحة:</label>
                        <input type="text" class="plate" required placeholder="أدخل اللوحة">
                    </div>
